# Local development dependencies for pg-lease-rate.
#
# Nothing in the gateway connects to these yet: the current binary only
# performs the startup exchange. They are here because they are the topology
# the next steps target - Postgres as both the lease metadata store and the
# backend being proxied, Redis as the token-bucket store.
#
# Credentials below are local-only throwaways. Do not reuse them anywhere.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pglr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pglr"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
